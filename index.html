<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年度 全日本学生ヨット選手権大会 公式ポータル</title>
    <meta name="description" content="2026年度 全日本学生ヨット個人選手権大会および第91回全日本学生ヨット選手権大会（団体戦）の公式ポータルサイトです。">

    <!-- アイコンフォント（Font Awesome） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- 共通CSSの読み込み（直下の css フォルダを指定） -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/container.css">
</head>

<body>

    <header>
        <h1>2026年度 全日本学生ヨット選手権大会</h1>
        <p style="text-align: center; margin-top: 10px; color: #666;">ご覧になりたい大会を選択してください</p>
    </header>

    <main class="container" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; padding: 40px 20px;">
        
        <!-- 個人選手権への分岐ボタン -->
        <!-- ※ kojin フォルダ内の index.html へ移動します -->
        <a href="kojin/" class="card-link" style="text-decoration: none; color: inherit; flex: 1; max-width: 400px; min-width: 280px;">
            <div class="card" style="text-align: center; padding: 30px; cursor: pointer;">
                <i class="fa-solid fa-user-large" style="font-size: 3rem; color: #0056b3; margin-bottom: 15px;"></i>
                <h2 style="margin-bottom: 15px;">2026年度<br>全日本学生ヨット個人選手権</h2>
                <p style="color: #666; font-size: 0.9rem;">個人戦の公示、SI、結果等はこちら</p>
                <div style="margin-top: 20px; font-weight: bold; color: #0056b3;">大会HPを見る ➔</div>
            </div>
        </a>

        <!-- 団体戦（第91回全日本）への分岐ボタン -->
        <!-- ※ dantai フォルダ内の index.html へ移動します -->
        <a href="dantai/" class="card-link" style="text-decoration: none; color: inherit; flex: 1; max-width: 400px; min-width: 280px;">
            <div class="card" style="text-align: center; padding: 30px; cursor: pointer;">
                <i class="fa-solid fa-users" style="font-size: 3rem; color: #0056b3; margin-bottom: 15px;"></i>
                <h2 style="margin-bottom: 15px;">第91回<br>全日本学生ヨット選手権大会</h2>
                <p style="color: #666; font-size: 0.9rem;">団体戦の公示、SI、結果等はこちら</p>
                <div style="margin-top: 20px; font-weight: bold; color: #0056b3;">大会HPを見る ➔</div>
            </div>
        </a>

    </main>

</body>

</html>
